# AQEF configuration. The Quality Gatekeeper and the Test Guard read this file.
# All thresholds are PROVISIONAL starting values, not calibrated targets.
# Measure your own baseline in the first month, then tune them.
# schemas/config.schema.json describes every key and says which bot, agent or human enforces it.

config_version: 2
aqef_version: "0.2.0"

paths:
  domain_kb: domain/
  features: features/
  specs: specs/
  triage: triage/
  reports: reports/
  decisions: docs/decisions/        # your project's decisions (D-nnn); see skill aqef-decision-change
  test_architecture: qa/test-architecture.md

# Blocking budget (AQEF framework decision AQEF-002): only facts block a merge.
# FAIL (blocks, every tier): new product defect, Test Guard violation, data guard violation,
#   missing red-before-green evidence, criteria coverage below the tier minimum, required metric missing.
# Everything else is an escalation. Each tier's `on_escalate` decides what an escalation does:
#   block     -> ESCALATE, exit 2: the merge waits for a human gate
#   follow_up -> FOLLOW_UP, exit 0: the merge goes ahead, CI opens a follow-up task for the listed gates
#   comment   -> PASS with advisories, exit 0: a comment only
gate:
  required_metrics: [criteria_coverage, red_before_green_all, test_guard_violations, new_product_defects]
  advisory_metrics: [flake_rate, ui_share]   # reported as an advisory when missing; never block

# Risk tiers. Assign one tier to each capability in domain/capabilities/*.md
tiers:
  t1:
    description: Money, safety, security, privacy, legal
    mutation_score_min: 0.80
    seeded_fault_detection_min: 0.95
    criteria_coverage_min: 1.00
    flake_reruns: 10
    nfr_required: [security, performance, accessibility]
    human_gates: [H1, H2, H3, H4]    # always; H3 makes every T1 change wait for a human
    on_escalate: block
  t2:
    description: Core user journeys
    mutation_score_min: 0.70
    seeded_fault_detection_min: 0.90
    criteria_coverage_min: 1.00
    flake_reruns: 5
    nfr_required: [security]
    human_gates: [H1, H4]
    escalate_gates: [H3]             # the human gate that an escalation asks for
    on_escalate: follow_up
  t3:
    description: Internal tools, cosmetic changes
    mutation_score_min: null         # not measured
    seeded_fault_detection_min: null
    criteria_coverage_min: 0.95
    flake_reruns: 3
    nfr_required: []
    human_gates: [H1, H4]
    escalate_gates: [H3]
    on_escalate: comment
    sample_audit_rate: 0.10          # H3 follow-up on a 10% sample, chosen by a hash of the feature ID

suite_rules:
  red_before_green_required: true
  ui_share_max: 0.10                 # share of tests at UI level
  gating_flake_rate_max: 0.01
  quarantine_max_sprints: 2

# Speed budget (AQEF framework decision AQEF-004). Targets, not gates: missing them never fails a build.
speed_budget:
  pr_minutes: {t1: 20, t2: 10, t3: 10}            # QE time added to PR feedback
  gate_response_hours: {H1: 8, H2: 8, H3: 4, H5: 4}   # working hours
  on_gate_timeout: backup_reviewer                # the only allowed value: a late gate is never auto-approved

# Test Guard: blocks diffs that delete, skip or weaken tests.
test_guard:
  include:                           # a changed file is a test file when its path or name matches
    - "test_*.py"
    - "*_test.py"
    - "*.test.*"
    - "*.spec.*"
    - "*Test.java"
    - "*Tests.java"
    - "*Test.kt"
    - "*Test.cs"
    - "*Tests.cs"
    - "*_test.go"
    - "*.feature"
    - "tests/*"
    - "test/*"
    - "*/tests/*"
    - "*/test/*"
    - "*/__tests__/*"
  waivers: .aqef/test-guard-waivers.yaml   # protect this file with CODEOWNERS

review_panel:
  provider: aqef                     # aqef | qestack | custom
  personas:
    - ai-behavior-auditor
    - hallucination-checker
    - domain-oracle-reviewer
    - test-automation-architect
    - determinism-flakiness-engineer
    - maintainability-craftsperson
    - suite-cost-speed-reviewer
  accept_score_min: 80               # Test Quality Score, 0 to 100

# Autonomy levels: L0 suggest, L1 draft, L2 act reviewed, L3 act alone audited, L4 autonomous
autonomy:
  promotion:
    min_decisions: 50
    window_days: 30
    min_audit_agreement: 0.95
    no_t1_miss: true
  demotion:
    on_t1_miss: true
    audit_agreement_below: 0.90
  agents:
    spec-critic:             {t1: L1, t2: L1, t3: L1}
    risk-analyst:            {t1: L1, t2: L1, t3: L1}
    domain-curator:          {t1: L1, t2: L1, t3: L1}
    scenario-designer:       {t1: L1, t2: L2, t3: L2}
    test-strategist:         {t1: L1, t2: L2, t3: L2}
    test-data-designer:      {t1: L1, t2: L2, t3: L2}
    automation-engineer:     {t1: L2, t2: L2, t3: L2}
    test-fixer:              {t1: L1, t2: L2, t3: L2}
    defect-reporter:         {t1: L1, t2: L2, t3: L2}
    failure-triage:          {t1: L1, t2: L1, t3: L1}   # promote per state with evidence
    nfr-test-designer:       {t1: L1, t2: L2, t3: L2}
    # Read-only agents. They only report; a human gate or the gatekeeper reads their output.
    test-plan-reviewer:      {t1: L3, t2: L3, t3: L3}
    test-review-panel:       {t1: L3, t2: L3, t3: L3}
    fault-seeder:            {t1: L3, t2: L3, t3: L3}
    coverage-traceability-analyst: {t1: L3, t2: L3, t3: L3}
    report-analyst:          {t1: L3, t2: L3, t3: L3}

# Triage: the agent acts alone only above these confidence bars.
triage:
  rerun_count: 1
  confidence_bars:
    product_defect_new: 0.85
    known_defect: 0.90
    test_defect: 0.85
    test_data_issue: 0.85
    environment: 0.80
    flaky: 0.85
  # States that always need gate H5, in every tier.
  never_autonomous:
    - expected_change              # changes the oracle
  # States that need gate H5 when the failing test is T1.
  # Alerts for regression_of_fixed_defect still go out at once in every tier.
  t1_requires_human:
    - regression_of_fixed_defect   # reopening a T1 defect
    - flaky                        # a T1 test never leaves the gating suite alone

# Stages: when each test command runs. Names in `runs` come from `commands` below.
# gating: true means a failure stops the merge (pr) or the release (release).
# T1 changes also run the post_merge commands before merge. Time targets live in speed_budget only.
stages:
  precheck:   {gating: false, runs: [unit]}                                  # in the agent session, before the PR
  pr:         {gating: true,  runs: [unit, integration, api, security_sast]}
  post_merge: {gating: false, runs: [ui, mutation, a11y]}
  nightly:    {gating: false, runs: [unit, integration, api, ui, mutation, a11y, perf]}
  release:    {gating: true,  runs: [ui, perf, security_dast]}

# Tool commands. The Execution Bot and the agents call these. Replace them with your own.
# by_tags runs the tests that carry the tags in {tags}. Examples for other stacks are below.
commands:
  unit: "mvn -q test"
  integration: "mvn -q verify -Pintegration"
  api: "npx playwright test --project=api"
  ui: "npx playwright test --project=ui"
  mutation: "mvn -q org.pitest:pitest-maven:mutationCoverage"
  a11y: "npx playwright test --grep @nfr:a11y"
  perf: "k6 run perf/smoke.js"
  security_sast: "semgrep ci"
  security_dast: "zap-baseline.py -t $BASE_URL"
  by_tags: "npx playwright test --grep \"{tags}\""

# Other stacks: replace the matching lines above.
#
# Java, JUnit 5 tags (@Tag("level:api")):
#   by_tags: "mvn -q test -Dgroups=\"{tags}\""
#
# Python, pytest. pytest selects marker names only, so tags that select tests are
# markers such as level_api and risk_t1 (see taxonomy/tags.md):
#   unit: "pytest -q -m level_unit"
#   integration: "pytest -q -m level_integration"
#   api: "pytest -q -m level_api"
#   mutation: "mutmut run"
#   by_tags: "pytest -q -m \"{tags}\""
#
# Node, Vitest or Jest for unit tests, Playwright for api and ui:
#   unit: "npx vitest run"            # or "npx jest"
#   mutation: "npx stryker run"
#   by_tags: "npx playwright test --grep \"{tags}\""
