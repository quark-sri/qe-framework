necap="round" marker-end="url(#m14213D)"/><path d="M707.8 530.0 L707.8 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="627.5" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="707.8" y="594.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Write and prove</text><text x="707.8" y="614.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">tests</text><rect x="684.1" y="666.0" width="47.3" height="31.0" rx="15.5" fill="#FAEBD7" stroke="#B45309" stroke-width="1.5"/><text x="707.8" y="686.5" font-size="14" font-weight="600" fill="#8A3B05" text-anchor="middle">H3</text><rect x="812.0" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="892.2" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">5 Converge</text><path d="M974.5 502.0 L994.5 502.0" fill="none" stroke="#14213D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m14213D)"/><path d="M892.2 530.0 L892.2 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="812.0" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="892.2" y="604.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Gate on evidence</text><rect x="862.2" y="666.0" width="60.1" height="31.0" rx="15.5" fill="#DCEFEA" stroke="#0F766E" stroke-width="1.5"/><text x="892.2" y="686.5" font-size="14" font-weight="600" fill="#0B5A54" text-anchor="middle">Auto</text><rect x="996.5" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="1076.8" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">6 Deploy</text><path d="M1159.0 502.0 L1179.0 502.0" fill="none" stroke="#14213D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m14213D)"/><path d="M1076.8 530.0 L1076.8 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="996.5" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1076.8" y="594.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Regression per</text><text x="1076.8" y="614.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">environment</text><rect x="1046.7" y="666.0" width="60.1" height="31.0" rx="15.5" fill="#DCEFEA" stroke="#0F766E" stroke-width="1.5"/><text x="1076.8" y="686.5" font-size="14" font-weight="600" fill="#0B5A54" text-anchor="middle">Auto</text><rect x="1181.0" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="1261.2" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">7 Triage</text><path d="M1343.5 502.0 L1363.5 502.0" fill="none" stroke="#14213D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m14213D)"/><path d="M1261.2 530.0 L1261.2 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="1181.0" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1261.2" y="594.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Agent triage and</text><text x="1261.2" y="614.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">fixes</text><rect x="1237.6" y="666.0" width="47.2" height="31.0" rx="15.5" fill="#FAEBD7" stroke="#B45309" stroke-width="1.5"/><text x="1261.2" y="686.5" font-size="14" font-weight="600" fill="#8A3B05" text-anchor="middle">H5</text><rect x="1365.5" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="1445.8" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">8 Report</text><path d="M1445.8 530.0 L1445.8 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="1365.5" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1445.8" y="594.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Layer and</text><text x="1445.8" y="614.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">capability reports</text><rect x="1421.9" y="666.0" width="47.8" height="31.0" rx="15.5" fill="#FAEBD7" stroke="#B45309" stroke-width="1.5"/><text x="1445.8" y="686.5" font-size="14" font-weight="600" fill="#8A3B05" text-anchor="middle">H4</text><path d="M1445.8 700.0 L1445.8 730.0 L154.2 730.0 L154.2 704.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><text x="800.0" y="758.0" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="middle">Learn: escapes and triage results update the knowledge base, tests and agent rules</text><rect x="50.0" y="810.0" width="480.0" height="112.0" rx="12" fill="#DCEFEA" stroke="#0F766E" stroke-width="2"/><text x="68.0" y="847.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">Shift left</text><text x="68.0" y="875.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Tests come from the spec and domain rules, before code</text><text x="68.0" y="897.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">exists.</text><rect x="560.0" y="810.0" width="480.0" height="112.0" rx="12" fill="#DCEFEA" stroke="#0F766E" stroke-width="2"/><text x="578.0" y="847.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">Evidence, not trust</text><text x="578.0" y="875.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Each test must fail before it passes. Mutation and seeded</text><text x="578.0" y="897.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">faults measure test strength.</text><rect x="1070.0" y="810.0" width="480.0" height="112.0" rx="12" fill="#DCEFEA" stroke="#0F766E" stroke-width="2"/><text x="1088.0" y="847.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">Control by risk</text><text x="1088.0" y="875.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Humans own intent, risk and release. Agents earn</text><text x="1088.0" y="897.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">autonomy with measured accuracy.</text><text x="50.0" y="954.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>