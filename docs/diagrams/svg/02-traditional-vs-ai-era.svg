<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1600 982" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker><marker id="m14213D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker><marker id="m7C8391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C8391"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">TRADITIONAL VS AI ERA</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Verification moves from the end of the cycle to every stage</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Same delivery goal, different place for quality: built in by agents, gated by humans on risk.</text><rect x="50.0" y="170.0" width="1500.0" height="220.0" rx="16" fill="#E6E3DB"/><text x="74.0" y="204.0" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.5">TRADITIONAL SDLC · QA AT THE END</text><rect x="74.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="180.0" y="268.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">Requirements</text><path d="M289.0 264.0 L319.0 264.0" fill="none" stroke="#7C8391" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C8391)"/><text x="180.0" y="330.0" font-size="15" font-weight="400" fill="#5B6270" text-anchor="middle">QA not involved yet</text><rect x="322.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="428.0" y="268.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">Design</text><path d="M537.0 264.0 L567.0 264.0" fill="none" stroke="#7C8391" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C8391)"/><rect x="570.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="676.0" y="268.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">Development</text><path d="M785.0 264.0 L815.0 264.0" fill="none" stroke="#7C8391" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C8391)"/><text x="676.0" y="330.0" font-size="15" font-weight="400" fill="#5B6270" text-anchor="middle">Automation lags a sprint</text><rect x="818.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#7C8391" stroke-width="2"/><text x="924.0" y="257.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">QA writes and runs</text><text x="924.0" y="279.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">tests</text><path d="M1033.0 264.0 L1063.0 264.0" fill="none" stroke="#7C8391" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C8391)"/><text x="924.0" y="330.0" font-size="15" font-weight="400" fill="#5B6270" text-anchor="middle">Manual triage · coverage %</text><rect x="1066.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="1172.0" y="268.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">Release</text><path d="M1281.0 264.0 L1311.0 264.0" fill="none" stroke="#7C8391" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m7C8391)"/><text x="1172.0" y="330.0" font-size="15" font-weight="400" fill="#5B6270" text-anchor="middle">One pass rate</text><rect x="1314.0" y="228.0" width="212.0" height="72.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="1420.0" y="257.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">Bugs found in</text><text x="1420.0" y="279.0" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">production</text><text x="1420.0" y="330.0" font-size="15" font-weight="400" fill="#5B6270" text-anchor="middle">Late, costly fixes</text><rect x="50.0" y="420.0" width="1500.0" height="360.0" rx="16" fill="#DCEFEA"/><text x="74.0" y="454.0" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AI-AGENT SDLC WITH AQEF · VERIFICATION AT EVERY STAGE</text><rect x="74.0" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="154.2" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">1 Specify</text><path d="M236.5 502.0 L256.5 502.0" fill="none" stroke="#14213D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m14213D)"/><path d="M154.2 530.0 L154.2 552.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="74.0" y="552.0" width="160.5" height="100.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="154.2" y="594.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">Spec review and</text><text x="154.2" y="614.0" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">risk tier</text><rect x="132.1" y="666.0" width="44.4" height="31.0" rx="15.5" fill="#FAEBD7" stroke="#B45309" stroke-width="1.5"/><text x="154.2" y="686.5" font-size="14" font-weight="600" fill="#8A3B05" text-anchor="middle">H1</text><rect x="258.5" y="476.0" width="160.5" height="52.0" rx="10" fill="#14213D"/><text x="338.8" y="508.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">2 Plan</text><path d="M421.0 502.0 L441.0 502.0" fill="none" stroke="#14213D" stroke-width="2" st