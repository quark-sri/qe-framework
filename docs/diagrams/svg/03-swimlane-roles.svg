<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">WHO DOES WHAT, STAGE BY STAGE</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Swimlane: humans, agents and bots across the AI SDLC</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Each lane has one kind of worker. Humans sit on the top lane and act only at gates.</text><rect x="242.0" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="320.2" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">1 Specify</text><rect x="406.5" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="484.8" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">2 Plan</text><rect x="571.0" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="649.2" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">3 Tasks</text><rect x="735.5" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="813.8" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">4 Implement</text><rect x="900.0" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="978.2" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">5 Converge</text><rect x="1064.5" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="1142.8" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">6 Deploy, run</text><rect x="1229.0" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="1307.2" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">7 Triage, fix</text><rect x="1393.5" y="168.0" width="156.5" height="48.0" rx="10" fill="#14213D"/><text x="1471.8" y="198.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="middle">8 Report, learn</text><rect x="50.0" y="228.0" width="180.0" height="96.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="68.0" y="274.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">Humans</text><text x="68.0" y="298.0" font-size="14" font-weight="400" fill="#5B6270" text-anchor="start">approve at gates</text><rect x="242.0" y="228.0" width="156.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="254.0" y="256.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">H1: approve</text><text x="254.0" y="276.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">criteria and risk</text><text x="254.0" y="296.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">tier</text><rect x="406.5" y="228.0" width="156.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="418.5" y="256.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">H2: approve test</text><text x="418.5" y="276.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">plan (by risk)</text><rect x="571.0" y="228.0" width="156.5" height="96.0" rx="10" fill="none" stroke="#CFCBC0" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="735.5" y="228.0" width="156.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="747.5" y="256.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">H3: accept tests</text><text x="747.5" y="276.0" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">(by risk)</text><rect x="900.0" y="228.0" width="156.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="912.0" y="256.0" font-size="15" font-weight="400"