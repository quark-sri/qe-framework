<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1033" viewBox="0 0 1600 1033" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker><marker id="mB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">STAGES 6–7 · DEPLOY, RUN AND TRIAGE</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Every failure gets a state, an action and a confidence</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">The triage agent acts alone only above a confidence bar. Everything else goes to a human.</text><rect x="50.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="68.0" y="200.0" font-size="12" font-weight="600" fill="#14213D" text-anchor="start" letter-spacing="1.5">BOT</text><text x="68.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Normalize</text><text x="68.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">All result formats into one</text><text x="68.0" y="274.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">tagged record</text><path d="M278.0 234.5 L302.0 234.5" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="305.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="323.0" y="200.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="323.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Group</text><text x="323.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Cluster by error signature</text><text x="323.0" y="274.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">and step</text><path d="M533.0 234.5 L557.0 234.5" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="560.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="578.0" y="200.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="578.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Match</text><text x="578.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Known defects and past</text><text x="578.0" y="274.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">triage records</text><path d="M788.0 234.5 L812.0 234.5" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="815.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="833.0" y="200.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="833.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Check env</text><text x="833.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Health checks, deploy log,</text><text x="833.0" y="274.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">timeouts</text><path d="M1043.0 234.5 L1067.0 234.5" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1070.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="1088.0" y="200.0" font-size="12" font-weight="600" fill="#14213D" text-anchor="start" letter-spacing="1.5">BOT</text><text x="1088.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Rerun</text><text x="1088.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Once, in a clean container</text><path d="M1298.0 234.5 L1322.0 234.5" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1325.0" y="170.0" width="225.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1343.0" y="200.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="1343.0" y="227.1" font-size="18" font-weight="600" fill="#14213D" text-anchor="start">Diff</text><text x="1343.0" y="253.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Code, tests, data, spec</text><text x="1343.0" y="274.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">and KB changes</text><path d="M1437.5 302.0 L1437.5 345.0 L1010.0 345.0 L1010.0 365.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="790.0" y="369.0" width="440.0" height="62.0" rx="12" fill="#DCEFEA" stroke="#0F766E" stroke-width="2.5"/><text x="1010.0" y="407.0" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">Classify: state + confidence + evidence</text><path d="M1010.0 433.0 L1010.0 453.0" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><polygon points="1010.0,457.0 1220.0,515.0 1010.0,573.0 800.0,515.0" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="1010.0" y="509.0" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">Confidence ≥ bar and</text><text x="1010.0" y="531.0" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">action allowed?</text><path d="M800.0 515.0 L230.0 515.0 L230.0 621.0" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mB45309)"/><text x="560.0" y="505.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="middle">No</text><rect x="50.0" y="625.0" width="360.0" height="133.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="68.0" y="655.0" font-size="12" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.5">HUMAN</text><text x="68.0" y="683.0" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">H5 human queue</text><text x="68.0" y="711.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">A QE engineer confirms or corrects the</text><text x="68.0" y="733.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">state. The answer trains the agent.</text><path d="M1010.0 573.0 L1010.0 603.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1024.0" y="593.0" font-size="16" font-weight="600" fill="#0B5A54" text-anchor="start">Yes: act automatically</text><path d="M580.0 603.0 L1420.0 603.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M580.0 603.0 L580.0 621.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><path d="M860.0 603.0 L860.0 621.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><path d="M1140.0 603.0 L1140.0 621.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><path d="M1420.0 603.0 L1420.0 621.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="450.0" y="625.0" width="260.0" height="127.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="468.0" y="659.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Product defect</text><text x="468.0" y="685.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Defect Reporter raises a bug</text><text x="468.0" y="706.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">with evidence; test tagged</text><text x="468.0" y="727.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">@defect</text><rect x="730.0" y="625.0" width="260.0" height="127.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="748.0" y="659.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Known defect</text><text x="748.0" y="685.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Link to the open defect; no new</text><text x="748.0" y="706.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">ticket</text><rect x="1010.0" y="625.0" width="260.0" height="127.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="1028.0" y="659.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Fixed defect regressed</text><text x="1028.0" y="685.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Reopen and alert the owner. T1:</text><text x="1028.0" y="706.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">human first</text><rect x="1290.0" y="625.0" width="260.0" height="127.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1308.0" y="659.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Test defect</text><text x="1308.0" y="685.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Test Fixer opens a fix PR; the</text><text x="1308.0" y="706.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">panel reviews it</text><rect x="450.0" y="772.0" width="260.0" height="127.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="468.0" y="806.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Test data issue</text><text x="468.0" y="832.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Fix the builder or reseed the</text><text x="468.0" y="853.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">data</text><rect x="730.0" y="772.0" width="260.0" height="127.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="748.0" y="806.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Environment</text><text x="748.0" y="832.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Ops ticket; rerun after recovery</text><rect x="1010.0" y="772.0" width="260.0" height="127.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="1028.0" y="806.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Flaky</text><text x="1028.0" y="832.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Quarantine with ticket and</text><text x="1028.0" y="853.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">deadline. T1: human first</text><rect x="1290.0" y="772.0" width="260.0" height="127.0" rx="12" fill="#FAEBD7" stroke="#B45309" stroke-width="2"/><text x="1308.0" y="806.1" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">Expected change</text><text x="1308.0" y="832.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">Spec changed. Never</text><text x="1308.0" y="853.2" font-size="15" font-weight="400" fill="#3D4A5C" text-anchor="start">automatic: always H5</text><text x="50.0" y="943.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Rules: a T1 failure never leaves the gating suite without a human decision. A pass on rerun alone does not prove a test is flaky: flaky tests can also reveal real defects. Every triage record is saved and</text><text x="50.0" y="966.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">used to calibrate the agent.</text><text x="50.0" y="1005.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>