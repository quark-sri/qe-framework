<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="743" viewBox="0 0 1600 743" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">STAGE 2 · PLAN</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Design tests from the spec, not from the code</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Gherkin scenarios, test levels and synthetic data are designed before implementation starts.</text><text x="480.0" y="188.0" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AI ERA · AQEF</text><rect x="480.0" y="206.0" width="234.5" height="177.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="498.0" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="498.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Scenario Designer</text><text x="498.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Gherkin per criterion:</text><text x="498.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">partitions, boundaries,</text><text x="498.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">decision tables, states,</text><text x="498.0" y="358.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">negatives</text><path d="M718.5 294.5 L754.5 294.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="758.5" y="206.0" width="234.5" height="177.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="776.5" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="776.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Test Strategist</text><text x="776.5" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Lowest level that proves</text><text x="776.5" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">it; owner; pyramid and</text><text x="776.5" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">cost check</text><path d="M997.0 294.5 L1033.0 294.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1037.0" y="206.0" width="234.5" height="177.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1055.0" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="1055.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Test Data Designer</text><text x="1055.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Synthetic data from KB</text><text x="1055.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">entities and rules, with</text><text x="1055.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">fixed seeds</text><path d="M1275.5 294.5 L1311.5 294.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1315.5" y="206.0" width="234.5" height="177.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1333.5" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="1333.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Plan Review panel</text><text x="1333.5" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Read-only lenses:</text><text x="1333.5" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">coverage, oracle, level,</text><text x="1333.5" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">data, redundancy</text><rect x="480.0" y="409.0" width="1070.0" height="138.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="500.0" y="445.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">READS</text><text x="630.0" y="445.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Approved spec · KB rules and entities · test architecture contract</text><text x="500.0" y="483.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">PRODUCES</text><text x="630.0" y="483.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">.feature files with tags · level matrix in test-plan.md · test-data-plan.md</text><text x="500.0" y="521.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.2">GUARDRAIL</text><text x="630.0" y="521.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Designers never read the implementation. Expected values come from the spec and the KB.</text><text x="480.0" y="589.0" font-size="16" font-weight="600" fill="#14213D" text-anchor="start">Exit gate</text><rect x="570.0" y="567.0" width="346.2" height="32.0" rx="16.0" fill="#FAEBD7" stroke="#B45309" stroke-width="1.5"/><text x="743.1" y="588.4" font-size="15" font-weight="600" fill="#8A3B05" text-anchor="middle">H2 · T1 always, T2 on ESCALATE, T3 sample</text><rect x="50.0" y="172.0" width="400.0" height="427.0" rx="16" fill="#E6E3DB"/><text x="74.0" y="208.0" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.5">TRADITIONAL</text><text x="76.0" y="246.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="246.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Manual cases written after</text><text x="98.0" y="270.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">development</text><text x="76.0" y="308.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="308.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Test level chosen by habit, often UI</text><text x="76.0" y="346.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="346.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Expected results copied from the app</text><text x="76.0" y="384.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="384.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Test data built by hand and shared</text><rect x="50.0" y="629.0" width="1500.0" height="54.0" rx="12" fill="#DCEFEA"/><rect x="50.0" y="629.0" width="8.0" height="54.0" rx="0" fill="#0F766E"/><text x="80.0" y="661.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="start">Why it matters: the test oracle stays independent of the code, so AI-written code cannot define its own ‘correct’ behaviour.</text><text x="50.0" y="715.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>