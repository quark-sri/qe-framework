<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">TRUST MODEL AND HUMAN GATES</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Agents earn autonomy; humans gate by risk</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Autonomy is set per agent and per risk tier. It goes up with evidence and down after a serious miss.</text><rect x="50.0" y="350.0" width="284.0" height="120.0" rx="14" fill="#E4F2EE"/><text x="70.0" y="410.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">L0 Suggest</text><text x="70.0" y="436.0" font-size="15" font-weight="400" fill="#14213D" text-anchor="start">Agent advises; a human does the</text><text x="70.0" y="455.0" font-size="15" font-weight="400" fill="#14213D" text-anchor="start">work</text><rect x="354.0" y="305.0" width="284.0" height="165.0" rx="14" fill="#C6E5DD"/><text x="374.0" y="410.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">L1 Draft</text><text x="374.0" y="436.0" font-size="15" font-weight="400" fill="#14213D" text-anchor="start">A human approves every output</text><rect x="658.0" y="260.0" width="284.0" height="210.0" rx="14" fill="#9FD3C6"/><text x="678.0" y="410.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">L2 Act, reviewed</text><text x="678.0" y="436.0" font-size="15" font-weight="400" fill="#14213D" text-anchor="start">A human reviews the pull request</text><rect x="962.0" y="215.0" width="284.0" height="255.0" rx="14" fill="#5BAF9F"/><text x="982.0" y="410.0" font-size="20" font-weight="600" fill="#14213D" text-anchor="start">L3 Act, audited</text><text x="982.0" y="436.0" font-size="15" font-weight="400" fill="#14213D" text-anchor="start">A human audits a 10% sample</text><rect x="1266.0" y="170.0" width="284.0" height="300.0" rx="14" fill="#0F766E"/><text x="1286.0" y="410.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">L4 Autonomous</text><text x="1286.0" y="436.0" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Humans review monthly metrics</text><rect x="50.0" y="495.0" width="486.7" height="111.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="68.0" y="531.0" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Promote one level</text><text x="68.0" y="559.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">50+ decisions in 30 days, at least 95% audit agreement, no</text><text x="68.0" y="581.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">T1 miss</text><rect x="556.7" y="495.0" width="486.7" height="111.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="574.7" y="531.0" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Demote at once</text><text x="574.7" y="559.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">After one T1 miss, or audit agreement below 90%</text><rect x="1063.3" y="495.0" width="486.7" height="111.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="1081.3" y="531.0" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Calibrate monthly</text><text x="1081.3" y="559.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Seeded faults and replayed triage cases with known</text><text x="1081.3" y="581.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">answers</text><text x="50.0" y="656.0" font-size="14" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.5">HUMAN QUALITY GATES</text><rect x="50.0" y="672.0" width="1500.0" height="44.0" rx="8" fill="#14213D"/><text x="66.0" y="700.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="start">Gate</text><text x="396.0" y="700.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="start">When</text><text x="816.0" y="700.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="start">Who decides</text><text x="1176.0" y="700.0" font-size="16" font-weight="600" fill="#F6F5F1" text-anchor="start">Decision</text><text x="66.0" y="744.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H1 Requirement review</text><text x="396.0" y="744.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Every story</text><text x="816.0" y="744.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Product owner, QE lead</text><text x="1176.0" y="744.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Criteria and tier approved</text><rect x="50.0" y="760.0" width="1500.0" height="44.0" rx="0" fill="#EEECE6"/><text x="66.0" y="788.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H2 Test plan review</text><text x="396.0" y="788.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">T1 always · T2 on ESCALATE · T3 sample</text><text x="816.0" y="788.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">QE engineer, domain expert</text><text x="1176.0" y="788.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Scenarios and levels approved</text><text x="66.0" y="832.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H3 Test review</text><text x="396.0" y="832.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">T1 always · others on ESCALATE</text><text x="816.0" y="832.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">QE engineer</text><text x="1176.0" y="832.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Tests accepted</text><rect x="50.0" y="848.0" width="1500.0" height="44.0" rx="0" fill="#EEECE6"/><text x="66.0" y="876.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H4 Release readiness</text><text x="396.0" y="876.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Every release</text><text x="816.0" y="876.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Release owner, QE lead</text><text x="1176.0" y="876.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Go or no-go</text><text x="66.0" y="920.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H5 Triage confirmation</text><text x="396.0" y="920.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Agent confidence below the bar</text><text x="816.0" y="920.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">QE triage rota</text><text x="1176.0" y="920.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Failure state confirmed</text><rect x="50.0" y="936.0" width="1500.0" height="44.0" rx="0" fill="#EEECE6"/><text x="66.0" y="964.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">H6 Knowledge base change</text><text x="396.0" y="964.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Every KB pull request</text><text x="816.0" y="964.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Domain expert</text><text x="1176.0" y="964.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Change merged</text><text x="50.0" y="1022.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>