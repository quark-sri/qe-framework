<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="838" viewBox="0 0 1600 838" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker><marker id="m14213D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker><marker id="mB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">OPERATING MODEL</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Bots measure, agents judge, humans decide</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Evidence flows left to right. Decisions flow back and set the rules for the next run.</text><rect x="50.0" y="170.0" width="420.0" height="444.0" rx="16" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><rect x="50.0" y="170.0" width="420.0" height="90.0" rx="16" fill="#14213D"/><rect x="50.0" y="230.0" width="420.0" height="30.0" rx="0" fill="#14213D"/><text x="76.0" y="214.0" font-size="28" font-weight="600" fill="#F6F5F1" text-anchor="start">Bots</text><text x="76.0" y="242.0" font-size="15" font-weight="400" fill="#F6F5F1" text-anchor="start">Deterministic scripts</text><text x="76.0" y="298.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">DOES</text><circle cx="82" cy="322" r="4" fill="#14213D"/><text x="98.0" y="328.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Run suites in dev containers and CI</text><circle cx="82" cy="354" r="4" fill="#14213D"/><text x="98.0" y="360.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Normalize results into one tagged store</text><circle cx="82" cy="386" r="4" fill="#14213D"/><text x="98.0" y="392.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Compute coverage, mutation score, flake</text><text x="98.0" y="416.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">rate</text><circle cx="82" cy="442" r="4" fill="#14213D"/><text x="98.0" y="448.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Block weakened or skipped tests (Test</text><text x="98.0" y="472.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Guard)</text><circle cx="82" cy="498" r="4" fill="#14213D"/><text x="98.0" y="504.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Apply gate thresholds from config</text><text x="76.0" y="550.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.5">NEVER</text><text x="80.0" y="578.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">–</text><text x="98.0" y="578.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">Make judgement calls</text><rect x="590.0" y="170.0" width="420.0" height="444.0" rx="16" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><rect x="590.0" y="170.0" width="420.0" height="90.0" rx="16" fill="#0F766E"/><rect x="590.0" y="230.0" width="420.0" height="30.0" rx="0" fill="#0F766E"/><text x="616.0" y="214.0" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">LLM agents</text><text x="616.0" y="242.0" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Specialist roles, narrow scope</text><text x="616.0" y="298.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">DOES</text><circle cx="622" cy="322" r="4" fill="#0F766E"/><text x="638.0" y="328.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Review specs and assign risk tiers</text><circle cx="622" cy="354" r="4" fill="#0F766E"/><text x="638.0" y="360.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Design Gherkin scenarios and test levels</text><circle cx="622" cy="386" r="4" fill="#0F766E"/><text x="638.0" y="392.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Write tests to the architecture contract</text><circle cx="622" cy="418" r="4" fill="#0F766E"/><text x="638.0" y="424.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Review tests as an expert panel</text><circle cx="622" cy="450" r="4" fill="#0F766E"/><text x="638.0" y="456.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Triage failures; draft bugs and fixes</text><text x="616.0" y="502.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.5">NEVER</text><text x="620.0" y="530.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">–</text><text x="638.0" y="530.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">Grade their own work</text><text x="620.0" y="558.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">–</text><text x="638.0" y="558.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">Read code to choose expected values</text><text x="620.0" y="586.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">–</text><text x="638.0" y="586.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">Weaken a test to get green</text><rect x="1130.0" y="170.0" width="420.0" height="444.0" rx="16" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><rect x="1130.0" y="170.0" width="420.0" height="90.0" rx="16" fill="#B45309"/><rect x="1130.0" y="230.0" width="420.0" height="30.0" rx="0" fill="#B45309"/><text x="1156.0" y="214.0" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">Humans</text><text x="1156.0" y="242.0" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">QE, product, domain, release</text><text x="1156.0" y="298.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">DOES</text><circle cx="1162" cy="322" r="4" fill="#B45309"/><text x="1178.0" y="328.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Approve criteria and risk tier (H1)</text><circle cx="1162" cy="354" r="4" fill="#B45309"/><text x="1178.0" y="360.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Approve high-risk plans and tests (H2, H3)</text><circle cx="1162" cy="386" r="4" fill="#B45309"/><text x="1178.0" y="392.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Confirm low-confidence triage (H5)</text><circle cx="1162" cy="418" r="4" fill="#B45309"/><text x="1178.0" y="424.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Decide go or no-go (H4)</text><circle cx="1162" cy="450" r="4" fill="#B45309"/><text x="1178.0" y="456.0" font-size="17" font-weight="400" fill="#3D4A5C" text-anchor="start">Approve knowledge changes (H6)</text><text x="1156.0" y="502.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.5">NEVER</text><text x="1160.0" y="530.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="start">–</text><text x="1178.0" y="530.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">Read everything: agents rank findings with</text><text x="1178.0" y="552.0" font-size="16" font-weight="400" fill="#5B6270" text-anchor="start">evidence</text><path d="M476.0 215.0 L584.0 215.0" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m14213D)"/><text x="530.0" y="181.0" font-size="13" font-weight="600" fill="#5B6270" text-anchor="middle">Metrics and</text><text x="530.0" y="197.0" font-size="13" font-weight="600" fill="#5B6270" text-anchor="middle">evidence</text><path d="M1016.0 215.0 L1124.0 215.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><text x="1070.0" y="181.0" font-size="13" font-weight="600" fill="#5B6270" text-anchor="middle">Ranked findings</text><text x="1070.0" y="197.0" font-size="13" font-weight="600" fill="#5B6270" text-anchor="middle">with evidence</text><path d="M1340.0 618.0 L1340.0 658.0 L260.0 658.0 L260.0 622.0" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mB45309)"/><text x="800.0" y="688.0" font-size="16" font-weight="600" fill="#8A3B05" text-anchor="middle">Decisions, approvals and thresholds set the rules for the next run</text><rect x="50.0" y="722.0" width="486.7" height="56.0" rx="12" fill="#14213D"/><text x="293.3" y="757.0" font-size="18" font-weight="600" fill="#F6F5F1" text-anchor="middle">No agent grades its own work</text><rect x="556.7" y="722.0" width="486.7" height="56.0" rx="12" fill="#14213D"/><text x="800.0" y="757.0" font-size="18" font-weight="600" fill="#F6F5F1" text-anchor="middle">Test designers never read the code</text><rect x="1063.3" y="722.0" width="486.7" height="56.0" rx="12" fill="#14213D"/><text x="1306.7" y="757.0" font-size="18" font-weight="600" fill="#F6F5F1" text-anchor="middle">Nothing weakens a test to get green</text><text x="50.0" y="810.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>