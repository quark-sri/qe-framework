<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="746" viewBox="0 0 1600 746" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">STAGES 3–4 · TASKS AND IMPLEMENT</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Write tests with the code and prove they can fail</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">Test tasks sit beside code tasks. Every new test must show red before green.</text><text x="480.0" y="188.0" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AI ERA · AQEF</text><rect x="480.0" y="206.0" width="234.5" height="180.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="498.0" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="498.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Dev coding agents</text><text x="498.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Unit tests with the code</text><text x="498.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">(TDD) for @level:unit</text><text x="498.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">scenarios</text><path d="M718.5 296.0 L754.5 296.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="758.5" y="206.0" width="234.5" height="180.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="776.5" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="776.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Automation</text><text x="776.5" y="289.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Engineers</text><text x="776.5" y="317.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">One per level:</text><text x="776.5" y="339.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">component, contract,</text><text x="776.5" y="361.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">integration, API, UI</text><path d="M997.0 296.0 L1033.0 296.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1037.0" y="206.0" width="234.5" height="180.0" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="1055.0" y="236.0" font-size="12" font-weight="600" fill="#14213D" text-anchor="start" letter-spacing="1.5">BOT</text><text x="1055.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Red before green</text><text x="1055.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Execution Bot shows</text><text x="1055.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">each test fail on old code</text><text x="1055.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">or a fault, then pass</text><path d="M1275.5 296.0 L1311.5 296.0" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1315.5" y="206.0" width="234.5" height="180.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1333.5" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="1333.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Gap loop</text><text x="1333.5" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Coverage and Traceability</text><text x="1333.5" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Analyst lists gaps; owners</text><text x="1333.5" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">close them</text><rect x="480.0" y="412.0" width="1070.0" height="138.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="500.0" y="448.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">READS</text><text x="630.0" y="448.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">.feature files · test architecture contract · public interfaces · data plan</text><text x="500.0" y="486.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">PRODUCES</text><text x="630.0" y="486.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Test code with tags · builders · run log with red and green evidence · gaps.md</text><text x="500.0" y="524.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.2">GUARDRAIL</text><text x="630.0" y="524.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">No production code changes. No skipped, deleted or weakened tests. No retries to hide timing.</text><text x="480.0" y="592.0" font-size="16" font-weight="600" fill="#14213D" text-anchor="start">Exit gate</text><rect x="570.0" y="570.0" width="310.4" height="32.0" rx="16.0" fill="#DCEFEA" stroke="#0F766E" stroke-width="1.5"/><text x="725.2" y="591.4" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="middle">Auto · new tests green in dev container</text><rect x="50.0" y="172.0" width="400.0" height="430.0" rx="16" fill="#E6E3DB"/><text x="74.0" y="208.0" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.5">TRADITIONAL</text><text x="76.0" y="246.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="246.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Automation lags one sprint behind</text><text x="76.0" y="284.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="284.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Scripts recorded from the UI</text><text x="76.0" y="322.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="322.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">A green test is assumed to work</text><text x="76.0" y="360.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="360.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Gaps found by chance, in production</text><rect x="50.0" y="632.0" width="1500.0" height="54.0" rx="12" fill="#DCEFEA"/><rect x="50.0" y="632.0" width="8.0" height="54.0" rx="0" fill="#0F766E"/><text x="80.0" y="664.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="start">Why it matters: a test that has never failed proves nothing. AQEF asks for evidence, not a green tick.</text><text x="50.0" y="718.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>