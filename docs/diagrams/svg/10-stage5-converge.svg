<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="721" viewBox="0 0 1600 721" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker></defs><rect width="100%" height="100%" fill="#F6F5F1"/><text x="50.0" y="58.0" font-size="15" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="2">STAGE 5 · CONVERGE</text><text x="50.0" y="100.0" font-size="34" font-weight="600" fill="#14213D" text-anchor="start">Prove the whole change before it merges</text><text x="50.0" y="134.0" font-size="18" font-weight="400" fill="#3D4A5C" text-anchor="start">The merge gate is automatic. People look only at what the gatekeeper flags.</text><text x="480.0" y="188.0" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AI ERA · AQEF</text><rect x="480.0" y="206.0" width="234.5" height="155.0" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="498.0" y="236.0" font-size="12" font-weight="600" fill="#14213D" text-anchor="start" letter-spacing="1.5">BOT</text><text x="498.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Execution Bot</text><text x="498.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Impact-based regression</text><text x="498.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">in the dev container; T1</text><text x="498.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">runs everything</text><path d="M718.5 283.5 L754.5 283.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="758.5" y="206.0" width="234.5" height="155.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="776.5" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="776.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Failure Triage</text><text x="776.5" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Classifies each failure; a</text><text x="776.5" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">real defect blocks the</text><text x="776.5" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">merge</text><path d="M997.0 283.5 L1033.0 283.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1037.0" y="206.0" width="234.5" height="155.0" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1055.0" y="236.0" font-size="12" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="1055.0" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Convergence check</text><text x="1055.0" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Every criterion is coded,</text><text x="1055.0" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">tested and green; no</text><text x="1055.0" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">orphan tests</text><path d="M1275.5 283.5 L1311.5 283.5" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m0F766E)"/><rect x="1315.5" y="206.0" width="234.5" height="155.0" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/><text x="1333.5" y="236.0" font-size="12" font-weight="600" fill="#14213D" text-anchor="start" letter-spacing="1.5">BOT</text><text x="1333.5" y="264.1" font-size="19" font-weight="600" fill="#14213D" text-anchor="start">Quality Gatekeeper</text><text x="1333.5" y="292.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Applies tier thresholds</text><text x="1333.5" y="314.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">from config: pass, fail or</text><text x="1333.5" y="336.2" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">escalate</text><rect x="480.0" y="387.0" width="1070.0" height="138.0" rx="12" fill="#FFFFFF" stroke="#CFCBC0" stroke-width="2"/><text x="500.0" y="423.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">READS</text><text x="630.0" y="423.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Normalized results · traceability matrix · .aqef/config.yaml</text><text x="500.0" y="461.0" font-size="13" font-weight="600" fill="#0B5A54" text-anchor="start" letter-spacing="1.2">PRODUCES</text><text x="630.0" y="461.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">PR quality summary · updated traceability matrix · triage records</text><text x="500.0" y="499.0" font-size="13" font-weight="600" fill="#8A3B05" text-anchor="start" letter-spacing="1.2">GUARDRAIL</text><text x="630.0" y="499.0" font-size="16" font-weight="400" fill="#3D4A5C" text-anchor="start">Thresholds come from config, not opinion. A new product defect always blocks the merge.</text><text x="480.0" y="567.0" font-size="16" font-weight="600" fill="#14213D" text-anchor="start">Exit gate</text><rect x="570.0" y="545.0" width="148.2" height="32.0" rx="16.0" fill="#DCEFEA" stroke="#0F766E" stroke-width="1.5"/><text x="644.1" y="566.4" font-size="15" font-weight="600" fill="#0B5A54" text-anchor="middle">Auto merge gate</text><rect x="50.0" y="172.0" width="400.0" height="405.0" rx="16" fill="#E6E3DB"/><text x="74.0" y="208.0" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.5">TRADITIONAL</text><text x="76.0" y="246.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="246.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Nightly regression in a shared</text><text x="98.0" y="270.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">environment</text><text x="76.0" y="308.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="308.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Failures sorted by hand the next</text><text x="98.0" y="332.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">morning</text><text x="76.0" y="370.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="370.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Merge when it looks “mostly green”</text><text x="76.0" y="408.0" font-size="17" font-weight="600" fill="#5B6270" text-anchor="start">–</text><text x="98.0" y="408.0" font-size="17" font-weight="400" fill="#464D5A" text-anchor="start">Spec and tests drift apart</text><rect x="50.0" y="607.0" width="1500.0" height="54.0" rx="12" fill="#DCEFEA"/><rect x="50.0" y="607.0" width="8.0" height="54.0" rx="0" fill="#0F766E"/><text x="80.0" y="639.0" font-size="18" font-weight="400" fill="#14213D" text-anchor="start">Why it matters: machines enforce the quality bar on every pull request, so humans are not the bottleneck again.</text><text x="50.0" y="693.0" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">AQEF · Agentic Quality Engineering Framework</text></svg>